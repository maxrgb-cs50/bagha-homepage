<!-- @dsCard height=336 -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--bg-page)}
.cv{position:relative;width:960px;height:336px;overflow:hidden;background:var(--bg-page)}
svg{position:absolute;left:0;top:0;display:block}
.navy{fill:var(--navy-900)}.navy7{fill:var(--navy-700)}.ink{fill:var(--ink-900)}.sand{fill:var(--sand-500)}.paper{fill:var(--paper-300)}
.rule{stroke:var(--sand-400);stroke-width:var(--border-w)}
.tile{rx:var(--radius-0)}
.txt{position:absolute;left:48px;bottom:40px;max-width:880px}
.name{margin:0;font-family:var(--font-display);font-weight:500;font-size:64px;line-height:.95;color:var(--text-strong)}
.tag{margin:16px 0 0;font-family:var(--font-body);font-size:14px;line-height:1.4;color:var(--text-muted)}
</style></head><body><div class="cv">
<svg width="960" height="112" viewBox="0 0 960 112" aria-hidden="true">
<!--
 blocks: navy-900 448w (space-8×7), ink-900 192w (space-8×3), sand-500 64w (space-8), paper-300 128w (space-10), navy-700 128w (space-10); all 112 tall, radius-0
 arrangement: a strip of unequal bands bleeding off the top and both edges, navy leading as the one brand colour, sand a narrow thread
 pattern: editorial serif, "prefer a rule to a box", sand as a 40px hairline thread → three sand-400 hairlines at border-w: two 40px (rule-accent-w) accent rules and one long rule crossing the bands
 scales: widths in space-8 / space-10 steps, rule offsets space-8 (64) and space-9 (96), radius-0 (square system)
-->
<rect class="navy tile" x="0" y="0" width="448" height="112"/>
<rect class="ink tile" x="448" y="0" width="192" height="112"/>
<rect class="sand tile" x="640" y="0" width="64" height="112"/>
<rect class="paper tile" x="704" y="0" width="128" height="112"/>
<rect class="navy7 tile" x="832" y="0" width="128" height="112"/>
<line class="rule" x1="64" y1="48.5" x2="104" y2="48.5"/>
<line class="rule" x1="64" y1="96.5" x2="960" y2="96.5"/>
<line class="rule" x1="856" y1="48.5" x2="896" y2="48.5"/>
</svg>
<div class="txt"><h1 class="name">Steuerkanzlei Bagha<br>Design System</h1><p class="tag">Persönliche Steuerberatung für Unternehmer, Privatpersonen und Existenzgründer in Regensburg.</p></div>
</div></body></html>
